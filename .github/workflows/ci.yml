name: Langulus::Anyness CI
on: push
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        managed: [ON, OFF]
        os: [ubuntu-24.04, windows-latest]
        build: [debug, release]
        cxx: [g++-15, clang++-19, clangcl] # v143 suppport has been dropped indefinitely due to too many compiler bugs and bad C++23 support. tested on v145, too - not there yet
        arch: [x86, x64]

        exclude:
          - os: ubuntu-24.04
            cxx: v143
          - os: ubuntu-24.04
            cxx: clangcl
          - os: windows-latest
            cxx: g++-15
          - os: windows-latest
            cxx: clang++-19

        include:
          - cxx: g++-15
            c: gcc-15
          - cxx: clang++-19
            c: clang-19
          - os: ubuntu-24.04
            arch: x86
            cmake_args: "-DCMAKE_CXX_FLAGS=-m32"
          - os: ubuntu-24.04
            arch: x64
            cmake_args: "-DCMAKE_CXX_FLAGS=-m64"
          - os: windows-latest
            arch: x86
            cmake_args: "-G \"Visual Studio 17 2022\" -A Win32"
          - os: windows-latest
            arch: x64
            cmake_args: "-G \"Visual Studio 17 2022\" -A x64"
          - managed: OFF
            suffix: ''
          - managed: ON
            suffix: '-managed'
          - build: debug
            debug_flags: "-DLANGULUS_OPTION_SAFE_MODE=ON"

    name: "${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}${{matrix.suffix}}"
    runs-on: ${{matrix.os}}
    steps:
      - name: Clone
        uses: actions/checkout@v5

      - if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86'
        name: Prepare Linux for cross-compilation
        run: |
          sudo apt update
          sudo apt install g++-15-multilib

      - if: matrix.cxx == 'clang++-19'
        name: Installing Clang 19
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt update
          sudo apt install clang-19

      - if: matrix.os == 'ubuntu-24.04'
        name: Configure (Linux)
        run: >
          mkdir build && cd build && cmake ..
          -DCMAKE_C_COMPILER=${{matrix.c}}
          -DCMAKE_CXX_COMPILER=${{matrix.cxx}}
          ${{matrix.cmake_args}}
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}${{matrix.suffix}}-${{github.ref_name}}-${{github.sha}}\"
          -DLANGULUS_OPTION_MANAGED_MEMORY=${{matrix.managed}}
          -DLANGULUS_OPTION_MANAGED_REFLECTION=${{matrix.managed}}
          -DLANGULUS_OPTION_TESTING=ON
          ${{matrix.debug_flags}}

      - if: matrix.os == 'windows-latest'
        name: Configure (Windows)
        run: >
          mkdir build && cd build && cmake ..
          ${{matrix.cmake_args}} -T "${{matrix.cxx}}"
          -DCMAKE_BUILD_TYPE=${{matrix.build}}
          -DLANGULUS_BUILD_ID=\"${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}${{matrix.suffix}}-${{github.ref_name}}-${{github.sha}}\"
          -DLANGULUS_OPTION_MANAGED_MEMORY=${{matrix.managed}}
          -DLANGULUS_OPTION_MANAGED_REFLECTION=${{matrix.managed}}
          -DLANGULUS_OPTION_TESTING=ON
          ${{matrix.debug_flags}}

      - name: Build
        run: cmake --build build -j4 --config ${{matrix.build}}

      - name: Test
        run: cd build && ctest -V -C ${{matrix.build}}

      - name: 'Upload artifacts'
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: "artifacts-${{matrix.os}}-${{matrix.cxx}}-${{matrix.build}}-${{matrix.arch}}${{matrix.suffix}}-${{github.ref_name}}-${{github.sha}}"
          path: build/bin/*.txt
          retention-days: 7